services:
  manto:
    build:
      context: .
    image: manto:local
    container_name: manto
    restart: unless-stopped
    environment:
      PORT: "41875"
      MANTO_DB_PATH: /data/manto.sqlite
      PUBLIC_URL: ${PUBLIC_URL:-https://manto.xin}
      PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:-https://manto.xin/mcp}
      ONEPAY_BASE_URL: ${ONEPAY_BASE_URL:-https://onepay.minapp.xin}
      ONEPAY_CREATE_URL: ${ONEPAY_CREATE_URL:-}
      ONEPAY_QUERY_URL: ${ONEPAY_QUERY_URL:-}
    ports:
      - "127.0.0.1:41875:41875"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:41875/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
