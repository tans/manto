server {
    listen 80;
    server_name manto.xin;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name manto.xin;

    access_log /www/sites/manto.xin/log/access.log main;
    error_log /www/sites/manto.xin/log/error.log;

    ssl_certificate /www/sites/manto.xin/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/manto.xin/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /www/sites/manto.xin/proxy/*.conf;
}

